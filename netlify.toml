[build]
  command = "npm run build"
  publish = "dist"

# Proxy /api requests to Railway backend
[[redirects]]
  from = "/api/*"
  to = "https://gas-website-production-46db.up.railway.app/api/:splat"
  status = 200
  force = true

# Proxy /uploads requests to Railway backend
[[redirects]]
  from = "/uploads/*"
  to = "https://gas-website-production-46db.up.railway.app/uploads/:splat"
  status = 200
  force = true

# Wajib untuk React SPA: semua route diarahkan ke index.html
# Tanpa ini, refresh halaman di /dashboard akan 404
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
